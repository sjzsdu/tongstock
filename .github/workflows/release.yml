name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - os: macos-13
            goos: darwin
            goarch: amd64
          - os: macos-14
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
        with:
          path: tongstock

      - name: Checkout picoclaw sibling module
        uses: actions/checkout@v4
        with:
          repository: sjzsdu/picoclaw
          path: picoclaw

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tongstock/go.mod
          cache-dependency-path: tongstock/go.sum

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: tongstock/web/pnpm-lock.yaml

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "value=manual-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install web dependencies
        working-directory: tongstock/web
        run: pnpm install --frozen-lockfile

      - name: Build web
        working-directory: tongstock/web
        run: pnpm build

      - name: Prepare embedded web assets
        working-directory: tongstock
        run: |
          rm -rf pkg/web/dist
          cp -r web/dist pkg/web/dist

      - name: Build package
        working-directory: tongstock
        shell: bash
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          package="tongstock-${VERSION}-${GOOS}-${GOARCH}"
          mkdir -p "dist/${package}"
          ext=""
          if [[ "${GOOS}" == "windows" ]]; then ext=".exe"; fi
          go build -trimpath -ldflags="-s -w" -o "dist/${package}/tongstock${ext}" ./cmd/cli
          go build -trimpath -ldflags="-s -w" -o "dist/${package}/tongstock-server${ext}" ./cmd/server
          cp README.md "dist/${package}/" || true
          if [[ "${GOOS}" == "windows" ]]; then
            (cd dist && 7z a "${package}.zip" "${package}")
          else
            tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          fi

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: tongstock-${{ steps.version.outputs.value }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            tongstock/dist/*.tar.gz
            tongstock/dist/*.zip
          if-no-files-found: error

  release:
    name: Publish draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: tongstock-*
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
