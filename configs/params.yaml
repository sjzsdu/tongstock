defaults:
  ma: [5, 10, 20, 60]
  macd:
    fast: 12
    slow: 26
    signal: 9
  kdj:
    n: 9
    m1: 3
    m2: 3
  boll:
    n: 20
    k: 2.0
  rsi: [6, 14]

# 三态状态模型（买入 / 卖出 / 中性）的判定阈值。指标周期复用上面的
# defaults / categories / overrides，这里只放阈值；0 或不写 = 用内置默认值。
state:
  cross:
    # |DIF - DEA| / 收盘价 <= 该比例 视为 DIF/DEA 缠绕（中性）。默认 0.002（0.2%）
    wrap_ratio: 0.002
  osc:
    # J <= oversold_j 为超卖（买入态）；J >= overbought_j 为超买（卖出态）
    oversold_j: 0
    overbought_j: 100
  boll:
    # 以上轨/下轨为中心的「触发带」宽度 = zone_ratio × 布林带宽（上轨-下轨）。
    # 用户裁定「突破的那个点的附近区域算交易机会」，调大即把附近区域放宽。
    zone_ratio: 0.15
  ma:
    # 均线排列的最小间距（最短均线 - 最长均线，占收盘价比例）；
    # 小于该值即便顺序正确也算纠缠（中性）
    min_spread_ratio: 0.001

categories:
  large_cap:
    ma: [5, 10, 20, 60, 120]
    macd:
      fast: 12
      slow: 26
      signal: 9
  small_cap:
    ma: [5, 10, 20]
    macd:
      fast: 8
      slow: 17
      signal: 9
    kdj:
      n: 7
      m1: 3
      m2: 3

overrides:
  "000001":
    kdj:
      n: 5
      m1: 3
      m2: 3
